name: Build APK
# Release: git tag v1.0.0 && git push --tags  → APK apetraka ao amin'ny GitHub Releases
# Fitsapana: GitHub → Actions → "Build APK" → Run workflow (APK ao amin'ny Artifacts ihany)
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Bubblewrap config
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
      - name: Keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > android.keystore
      - name: Build
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          npx --yes @bubblewrap/cli@1 update --manifest=twa-manifest.json --skipVersionUpgrade
          npx --yes @bubblewrap/cli@1 build --skipPwaValidation --manifest=twa-manifest.json
      - name: Anarana APK
        run: |
          V="${GITHUB_REF_NAME}"; case "$V" in v*) ;; *) V="test-${GITHUB_RUN_NUMBER}";; esac
          cp app-release-signed.apk "Baiboly-Plus-$V.apk"
          echo "APK_FILE=Baiboly-Plus-$V.apk" >> $GITHUB_ENV
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_FILE }}
          generate_release_notes: true
      - uses: actions/upload-artifact@v4
        with:
          name: baiboly-plus-apk
          path: |
            ${{ env.APK_FILE }}
            app-release-bundle.aab
